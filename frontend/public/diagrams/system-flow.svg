<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
<title id="title">From one indicator to a sourced investigation</title><desc id="desc">The API gathers external context, stores provenance, and reads bounded graph paths.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b5a1e7" stroke-width="1.5"/></marker></defs>
<rect width="1160" height="650" rx="18" fill="#14131f"/>
<text x="40" y="59.0" font-family="Arial,sans-serif" font-size="29" fill="#eee7fa">From one indicator to a sourced investigation</text>
<text x="40" y="94.0" font-family="Arial,sans-serif" font-size="16" fill="#b7abc9">The API gathers external context, stores provenance, and reads bounded graph paths.</text>
<rect x="40" y="160" width="260" height="112" rx="12" fill="#211b30" stroke="#aa8ee6" stroke-width="1.7"/>
<text x="58" y="197.0" font-family="Arial,sans-serif" font-size="19" fill="#eee7fa">01 / React workbench</text>
<text x="58" y="228.0" font-family="Arial,sans-serif" font-size="14" fill="#b7abc9">Domain or public IPv4</text>
<text x="58" y="246.9" font-family="Arial,sans-serif" font-size="14" fill="#b7abc9">Graph, evidence, report</text>
<rect x="440" y="160" width="260" height="112" rx="12" fill="#211b30" stroke="#83b8e8" stroke-width="1.7"/>
<text x="458" y="197.0" font-family="Arial,sans-serif" font-size="19" fill="#eee7fa">02 / FastAPI</text>
<text x="458" y="228.0" font-family="Arial,sans-serif" font-size="14" fill="#b7abc9">Validate, enrich, persist</text>
<text x="458" y="246.9" font-family="Arial,sans-serif" font-size="14" fill="#b7abc9">Trace paths and select a pivot</text>
<rect x="840" y="160" width="260" height="112" rx="12" fill="#211b30" stroke="#89c8a9" stroke-width="1.7"/>
<text x="858" y="197.0" font-family="Arial,sans-serif" font-size="19" fill="#eee7fa">03 / FalkorDB</text>
<text x="858" y="228.0" font-family="Arial,sans-serif" font-size="14" fill="#b7abc9">Indicators and observations</text>
<text x="858" y="246.9" font-family="Arial,sans-serif" font-size="14" fill="#b7abc9">Evidence and saved runs</text>
<rect x="40" y="410" width="260" height="112" rx="12" fill="#211b30" stroke="#e59cae" stroke-width="1.7"/>
<text x="58" y="447.0" font-family="Arial,sans-serif" font-size="19" fill="#eee7fa">AlienVault OTX</text>
<text x="58" y="478.0" font-family="Arial,sans-serif" font-size="14" fill="#b7abc9">Pulse context</text>
<text x="58" y="496.9" font-family="Arial,sans-serif" font-size="14" fill="#b7abc9">Historical passive DNS</text>
<rect x="440" y="410" width="260" height="112" rx="12" fill="#211b30" stroke="#89c8a9" stroke-width="1.7"/>
<text x="458" y="447.0" font-family="Arial,sans-serif" font-size="19" fill="#eee7fa">Google Public DNS</text>
<text x="458" y="478.0" font-family="Arial,sans-serif" font-size="14" fill="#b7abc9">Current domain A answers</text>
<text x="458" y="496.9" font-family="Arial,sans-serif" font-size="14" fill="#b7abc9">Up to five public IPv4s</text>
<rect x="840" y="410" width="260" height="112" rx="12" fill="#211b30" stroke="#aa8ee6" stroke-width="1.7"/>
<text x="858" y="447.0" font-family="Arial,sans-serif" font-size="19" fill="#eee7fa">Optional DeepSeek</text>
<text x="858" y="478.0" font-family="Arial,sans-serif" font-size="14" fill="#b7abc9">Bounded, audited tool calls</text>
<text x="858" y="496.9" font-family="Arial,sans-serif" font-size="14" fill="#b7abc9">Separate planner stage</text>
<polyline points="310,216 430,216" fill="none" stroke="#b5a1e7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="321" y="184" width="89" height="22" rx="4" fill="#14131f"/>
<text x="326" y="198.0" font-family="Arial,sans-serif" font-size="11" fill="#d1bff1">INVESTIGATE</text>
<polyline points="710,216 830,216" fill="none" stroke="#b5a1e7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="720" y="184" width="96" height="22" rx="4" fill="#14131f"/>
<text x="725" y="198.0" font-family="Arial,sans-serif" font-size="11" fill="#d1bff1">WRITE / READ</text>
<polyline points="485,284 170,398" fill="none" stroke="#b5a1e7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="257" y="327" width="82" height="22" rx="4" fill="#14131f"/>
<text x="262" y="341.0" font-family="Arial,sans-serif" font-size="11" fill="#d1bff1">OTX LOOKUP</text>
<polyline points="570,284 570,398" fill="none" stroke="#b5a1e7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="580" y="325" width="68" height="22" rx="4" fill="#14131f"/>
<text x="585" y="339.0" font-family="Arial,sans-serif" font-size="11" fill="#d1bff1">LIVE DNS</text>
<polyline points="655,284 970,398" fill="none" stroke="#b5a1e7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="812" y="327" width="82" height="22" rx="4" fill="#14131f"/>
<text x="817" y="341.0" font-family="Arial,sans-serif" font-size="11" fill="#d1bff1">IF ENABLED</text>
<text x="40" y="573.0" font-family="Arial,sans-serif" font-size="15" fill="#b7abc9">Source failures produce warnings and partial results; available evidence is retained.</text>
<text x="40" y="603.0" font-family="Arial,sans-serif" font-size="15" fill="#b7abc9">The report supports analyst review. It does not block traffic, isolate hosts, or establish compromise.</text>
</svg>
